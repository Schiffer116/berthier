<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Berthier console</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root {
  --accent: #F2A93B; --bg: #0A0D11; --panel: #0E1217; --bar: #141A22; --head: #11161D;
  --line: #263140; --rule: #1C242E; --field: #2E3A49; --sel: #1D2733;
  --fg: #D6DCE4; --bright: #E6E9EE; --soft: #C9D0D9; --muted: #9AA5B4; --dim: #7C8796; --faint: #5B6573;
  --blue: #7FB8F2; --sky: #A9C9EC; --green: #5FC48A; --red: #F06B6B; --purple: #B39DF0;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); }
a { color: var(--blue); } a:hover { color: #A9D0F7; }
.app { font-variant-ligatures: none; min-height: 100vh; background: var(--bg); color: var(--fg); font-family: 'JetBrains Mono', 'Symbols Nerd Font Mono', ui-monospace, monospace; font-size: 13px; line-height: 1.55; display: flex; flex-direction: column; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px; padding: 8px 16px; background: var(--bar); }
header.bar { border-bottom: 1px solid var(--line); }
footer.bar { padding: 6px 16px; border-top: 1px solid var(--line); color: var(--dim); font-size: 12px; }
.brand { font-weight: 700; color: var(--accent); }
.grow { flex-grow: 1; }
.loop { display: inline-flex; align-items: center; gap: 6px; }
.tally b { font-weight: 700; }
.zero { color: var(--dim); }
main { flex-grow: 1; padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; }
section { min-width: 0; border: 1px solid var(--line); background: var(--panel); }
.panel-col { display: flex; flex-direction: column; }
.ph { padding: 6px 12px; border-bottom: 1px solid var(--line); background: var(--head); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
h2 { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: var(--muted); }
h2 small { font-size: inherit; color: var(--dim); font-weight: 400; letter-spacing: 0.1em; }
/* The Army list takes the room; the selected unit is a compact side panel.
   Wide screens fill the viewport and scroll inside the panels; narrow ones stack. */
.top { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr) minmax(340px, 440px); align-items: start; }
.top > section { min-height: 0; max-height: 100%; }
#army { align-self: stretch; }
@media (min-width: 1100px) {
  .app { height: 100vh; }
  main { min-height: 0; }
  .top { flex: 1 1 0; min-height: 420px; }
}
@media (max-width: 1099px) { .top { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(220px, 40vh) auto; } }
/* Logs open from the top bar in a drawer over the page, never moving it. */
.logs { display: flex; gap: 6px; }
.logbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 2px 8px; background: transparent; color: var(--muted); border: 1px solid var(--field); border-radius: 0; font: inherit; cursor: pointer; }
.logbtn:hover { color: var(--fg); }
.logbtn[aria-expanded="true"] { background: var(--sel); color: var(--bright); border-color: var(--blue); }
.logbtn:focus-visible, .x:focus-visible { outline: 1px solid var(--blue); outline-offset: 1px; }
.badge { min-width: 20px; padding: 0 5px; background: var(--field); color: var(--fg); font-size: 11px; font-weight: 700; text-align: center; }
.badge.hot { background: var(--accent); color: var(--bg); }
.badge.bad { background: var(--red); color: var(--bg); }
.drawer { position: fixed; top: var(--drawer-top, 0); right: 0; bottom: 0; z-index: 10; width: min(600px, 100%); display: flex; flex-direction: column; border: 0; border-left: 1px solid var(--line); box-shadow: -12px 0 32px rgba(0, 0, 0, 0.55); transform: translateX(100%); visibility: hidden; transition: transform 0.15s ease-out, visibility 0s 0.15s; }
.drawer.open { transform: none; visibility: visible; transition: transform 0.15s ease-out; }
@media (prefers-reduced-motion: reduce) { .drawer, .drawer.open { transition: none; } }
.drawer > section { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; border: 0; }
.drawer > section[hidden] { display: none; }
.drawer ol { flex: 1 1 0; min-height: 0; overflow: auto; }
.ph .end { display: inline-flex; align-items: center; gap: 12px; }
.x { min-width: 28px; min-height: 28px; background: transparent; color: var(--muted); border: 1px solid var(--field); border-radius: 0; font: inherit; cursor: pointer; }
.x:hover { color: var(--bright); }
#army .scroll { flex: 1 1 0; min-height: 0; overflow: auto; }
#army .thead { position: sticky; top: 0; z-index: 1; background: var(--panel); }
#army .ph { gap: 8px 16px; }
.controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.filter { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.filter input { width: 140px; min-height: 32px; padding: 4px 8px; background: var(--bg); color: var(--fg); border: 1px solid var(--field); border-radius: 0; font: inherit; }
.filter input:focus { outline: 1px solid var(--blue); outline-offset: -1px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: var(--muted); cursor: pointer; }
.toggle input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
#show-loop { accent-color: var(--blue); }
.table { min-width: 480px; }
.grid { display: grid; grid-template-columns: 14px minmax(72px, 120px) 56px 76px 36px minmax(0, 1fr); gap: 10px; }
/* A narrow Army panel drops the PANE and FOR columns instead of scrolling. */
#army { container-type: inline-size; }
@container (max-width: 559px) {
  .table { min-width: 0; }
  .grid { grid-template-columns: 14px minmax(64px, 96px) 76px minmax(0, 1fr); }
  .grid > :nth-child(3), .grid > :nth-child(5) { display: none; }
}
.thead { padding: 6px 12px; color: var(--dim); font-size: 11px; letter-spacing: 0.08em; border-bottom: 1px solid var(--rule); }
.agent { align-items: center; width: 100%; min-height: 36px; padding: 0 12px; text-align: left; font: inherit; color: var(--fg); cursor: pointer; border: 0; border-bottom: 1px solid var(--rule); background: transparent; }
.agent:hover { background: #121820; }
.agent[aria-pressed="true"] { background: var(--sel); }
.agent:focus-visible { outline: 1px solid var(--blue); outline-offset: -1px; }
.clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.corps { font-weight: 700; }
.muted { color: var(--muted); } .dim { color: var(--dim); }
.empty { padding: 14px 12px; color: var(--dim); }
#det { flex: 0 1 auto; min-height: 0; overflow-y: auto; }
#detail .ph { flex-wrap: nowrap; }
#detail h2 span { color: var(--fg); }
.body { padding: 8px 12px; display: flex; flex-direction: column; gap: 8px; }
.link { padding: 0; margin-right: 8px; background: none; border: 0; color: var(--blue); font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.link:hover { color: #A9D0F7; }
.mates { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--rule); }
.mate { display: flex; flex-direction: column; gap: 1px; width: 100%; padding: 5px 6px; text-align: left; font: inherit; color: var(--fg); background: transparent; border: 0; border-bottom: 1px solid var(--rule); cursor: pointer; }
.mate:hover { background: #121820; }
.mate[aria-pressed="true"] { background: var(--sel); }
.mate:focus-visible, .link:focus-visible { outline: 1px solid var(--blue); outline-offset: -1px; }
.mate-l { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.mate-l b { font-weight: 700; min-width: 0; }
.mate-r { color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.mate-m { font-size: 11px; }
.cmd.check { margin: 0; font-size: 11px; color: var(--muted); white-space: normal; overflow-wrap: anywhere; }
/* Narrow screens keep the top bar to the essentials. */
@media (max-width: 699px) {
  .wide, .tally.zero, header .brand + .dim { display: none; }
  header.bar { gap: 4px 12px; padding: 6px 12px; }
  .logbtn { padding: 2px 6px; }
}
.needs { border: 1px solid #5A4318; background: #1E1A12; padding: 6px 10px; }
.needs div:first-child { color: var(--accent); font-weight: 700; }
.needs div + div { color: var(--bright); font-family: system-ui, sans-serif; font-size: 14px; margin-top: 2px; overflow-wrap: anywhere; }
dl { margin: 0; display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 1px 10px; }
dt { color: var(--dim); } dd { margin: 0; overflow-wrap: anywhere; }
.cap { color: var(--dim); font-size: 11px; letter-spacing: 0.08em; }
.cmd { margin-top: 4px; padding: 6px 10px; background: #000; border: 1px solid var(--field); overflow-x: auto; white-space: nowrap; }
.cmd.run { color: var(--bright); }
ol { margin: 0; padding: 6px 12px; list-style: none; }
.esc { display: grid; grid-template-columns: 48px 112px minmax(0, 1fr); gap: 4px 12px; padding: 4px 0; }
.esc .why { grid-column: 3; color: var(--dim); overflow-wrap: anywhere; }
@media (max-width: 480px) { .esc { grid-template-columns: 40px 64px minmax(0, 1fr); } }
.ask { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 12px; padding: 1px 0; }
#log { background: #000; }
#log .ph { padding: 0 12px; }
#log h2 { padding: 6px 0; }
#log ol { padding: 8px 12px; }
.log { display: grid; grid-template-columns: 72px 64px minmax(0, 1fr); gap: 12px; white-space: nowrap; }
.log span:last-child { color: var(--soft); }
.log.now span:last-child { color: var(--dim); }
.log.now b { color: var(--fg); font-weight: 400; }
.none { color: var(--dim); padding: 4px 0; }
#send { padding: 8px 12px 10px; border-top: 1px solid var(--rule); display: flex; flex-direction: column; gap: 6px; }
#send[hidden] { display: none; }
#send textarea { width: 100%; min-height: 56px; height: 56px; resize: vertical; padding: 6px 10px; background: var(--bg); color: var(--fg); border: 1px solid var(--field); border-radius: 0; font: inherit; }
#send textarea:focus { outline: 1px solid var(--blue); outline-offset: -1px; }
#send .acts { display: flex; align-items: center; gap: 12px; }
#send button { min-height: 32px; padding: 4px 14px; background: var(--accent); color: var(--bg); border: 0; border-radius: 0; font: inherit; font-weight: 700; cursor: pointer; }
#send button:disabled { opacity: 0.5; cursor: default; }
#send button:focus-visible { outline: 1px solid var(--blue); outline-offset: 2px; }
#send-status { overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <span class="brand">berthier</span>
    <span class="dim">▸ army</span>
    <span class="loop" id="loop"><span class="dim">connecting…</span></span>
    <span class="muted" id="fresh"></span>
    <span class="grow"></span>
    <span id="tallies" style="display: contents"></span>
    <span class="logs">
      <button type="button" class="logbtn" data-log="escalations" aria-controls="drawer" aria-expanded="false">escalations <span class="badge" id="esc-badge">0</span></button>
      <button type="button" class="logbtn" data-log="asks" aria-controls="drawer" aria-expanded="false">asks <span class="badge" id="ask-badge">0</span></button>
      <button type="button" class="logbtn" data-log="log" aria-controls="drawer" aria-expanded="false">main loop <span class="badge" id="log-badge">0</span></button>
    </span>
  </header>

  <main>
    <div class="top">
      <section id="army" class="panel-col" aria-labelledby="army-h">
        <div class="ph">
          <h2 id="army-h">ARMY <small id="army-sub"></small></h2>
          <div class="controls">
            <label class="filter">
              <span aria-hidden="true">/</span>
              <span class="sr">Filter agents</span>
              <input type="text" id="q" placeholder="filter" autocomplete="off" spellcheck="false">
            </label>
            <label class="toggle">
              <input type="checkbox" id="needs-only">
              needs you only
            </label>
          </div>
        </div>
        <div class="scroll">
          <div class="table">
            <div class="grid thead" aria-hidden="true"><span></span><span>CORPS</span><span>PANE</span><span>STATUS</span><span>FOR</span><span>REPORT</span></div>
            <div id="rows"></div>
          </div>
        </div>
      </section>

      <section id="detail" class="panel-col" aria-labelledby="det-h">
        <div id="det" aria-live="polite"></div>
        <!-- Outside #det so re-renders keep what the user is typing. -->
        <form id="send" hidden>
          <label class="cap" for="msg">MESSAGE <span id="send-to"></span></label>
          <textarea id="msg" placeholder="type to this agent · enter sends, shift+enter for a new line" spellcheck="false"></textarea>
          <div class="acts">
            <button type="submit" id="send-btn">send</button>
            <span class="dim" id="send-status" role="status"></span>
          </div>
        </form>
      </section>
    </div>

  </main>

  <aside id="drawer" class="drawer" aria-label="logs">
    <section id="escalations" aria-labelledby="esc-h" hidden>
      <div class="ph">
        <h2 id="esc-h">ESCALATIONS <small>· 7d</small></h2>
        <span class="end"><span class="dim" id="esc-n"></span><button type="button" class="x" aria-label="close">✕</button></span>
      </div>
      <ol id="esc"></ol>
    </section>
    <section id="asks" aria-labelledby="ask-h" hidden>
      <div class="ph">
        <h2 id="ask-h">ASKS <small>· delivered, last 1h</small></h2>
        <span class="end"><span id="inbox"></span><button type="button" class="x" aria-label="close">✕</button></span>
      </div>
      <ol id="ask"></ol>
    </section>
    <section id="log" aria-labelledby="log-h" hidden>
      <div class="ph">
        <h2 id="log-h">MAIN LOOP <small>· state/loop.log</small></h2>
        <span class="end">
          <label class="toggle">
            <input type="checkbox" id="show-loop">
            show loop restarts
          </label>
          <button type="button" class="x" aria-label="close">✕</button>
        </span>
      </div>
      <ol id="lines"></ol>
    </section>
  </aside>

  <footer class="bar">
    <span>reads state/ · sends only what you type</span>
    <span><span style="color: var(--accent)">●</span> needs you</span>
    <span><span style="color: var(--blue)">▶</span> working</span>
    <span><span style="color: var(--red)">■</span> blocked</span>
    <span><span style="color: var(--green)">✓</span> done / idle</span>
    <span><span style="color: var(--purple)">✕</span> gone</span>
  </footer>
</div>

<script>
'use strict';
// Renders `berthier army` (lib/army.jq), pushed by the dashboard server over
// /api/events. The only state here is what the viewer picked and is typing;
// the one write is a message to an Agent (POST api/prompt).

const C = { accent: '#F2A93B', blue: '#7FB8F2', sky: '#A9C9EC', soft: '#C9D0D9', muted: '#9AA5B4',
  dim: '#7C8796', faint: '#5B6573', green: '#5FC48A', red: '#F06B6B', purple: '#B39DF0', bright: '#E6E9EE' };
const LIVE = { working: ['▶', C.blue], blocked: ['■', C.red], done: ['✓', C.green], idle: ['✓', C.green],
  gone: ['✕', C.purple], unknown: ['?', C.muted] };
const TAG = { loop: C.faint, revive: C.purple, forget: C.purple, speak: C.accent, escal: C.accent,
  ask: C.blue, army: C.green, error: C.red, other: C.muted };
const LOG_LINES = 40;
const KIND = { revive_failed: 'revive failed', division_stopped: 'stopped', long: 'long run', ask_stuck: 'ask stuck' };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
const pref = (k, v) => { try { if (v === undefined) return localStorage.getItem(k) === '1'; localStorage.setItem(k, v ? '1' : '0'); } catch { return false; } };

let army = null, connected = false;
const drafts = {}; // unsent message per pane
// The selected Agent lives in the URL hash (#wJ:p2), so a link opens it.
const ui = { log: null, q: '', needsOnly: pref('needsOnly'), showLoop: pref('showLoop'), sel: decodeURIComponent(location.hash.slice(1)) || null };
$('needs-only').checked = ui.needsOnly;
$('show-loop').checked = ui.showLoop;

const now = () => Date.now() / 1000;
const pad = (n) => String(n).padStart(2, '0');
const clock = (t, secs = true) => {
  if (t == null) return '-';
  const d = new Date(t * 1000);
  return pad(d.getHours()) + ':' + pad(d.getMinutes()) + (secs ? ':' + pad(d.getSeconds()) : '');
};
const sameDay = (t) => new Date(t * 1000).toDateString() === new Date().toDateString();
const day = (t) => sameDay(t) ? clock(t, false) : new Date(t * 1000).toLocaleDateString('en', { weekday: 'short' });
const ago = (t) => {
  if (t == null) return '-';
  const s = Math.max(0, Math.floor(now() - t));
  return s < 60 ? s + 's' : s < 3600 ? Math.floor(s / 60) + 'm' : s < 86400 ? Math.floor(s / 3600) + 'h' : Math.floor(s / 86400) + 'd';
};
const home = (p) => (p || '-').replace(/^\/home\/[^/]+(?=\/|$)/, '~');

// Every Agent once, with the unit it belongs to: Corps, their Divisions, Berthier, Berthier's Divisions.
function agents() {
  const out = [];
  const add = (unit, role, parent) => unit.agents.forEach((a) => out.push({ ...a, unit, role, parent }));
  for (const c of army.corps) {
    add(c, 'corps');
    for (const d of c.divisions) add(d, 'division', c.name);
  }
  if (army.berthier) add({ name: 'berthier', agents: [army.berthier], divisions: army.berthier_divisions }, 'corps');
  for (const d of army.berthier_divisions) add(d, 'division', 'berthier');
  return out.map((a) => {
    const [glyph, color] = a.needs_you ? ['●', C.accent] : LIVE[a.status] || LIVE.unknown;
    // Waiting since the report that asked, or since the dialog appeared.
    const waitFrom = a.status === 'blocked' || a.report_at == null ? a.status_since : a.report_at;
    return { ...a, glyph, color, state: a.needs_you ? 'needs you' : a.status || 'unknown', from: a.needs_you ? waitFrom : a.status_since };
  });
}

function visible(all) {
  const q = ui.q.trim().toLowerCase();
  return all
    .filter((a) => !ui.needsOnly || a.needs_you)
    .filter((a) => !q || [a.who, a.pane_id, a.name, a.report, a.parent].join(' ').toLowerCase().includes(q))
    .sort((x, y) => (y.needs_you - x.needs_you) || (x.needs_you ? (x.from ?? 0) - (y.from ?? 0) : 0));
}

const ageSpan = (t) => `<span class="muted" data-ago="${t ?? ''}">${ago(t)}</span>`;

function renderHeader(all) {
  const k = army.counts, fresh = army.available;
  $('loop').innerHTML = fresh
    ? `<span style="color: ${C.green}" aria-hidden="true">●</span>main loop running<span class="wide"> · ${army.loop.interval}s · since ${clock(army.loop.started_at, false)}</span>`
    : `<span style="color: ${C.red}" aria-hidden="true">■</span>main loop not writing state`;
  const link = connected ? '' : ` · <span style="color: ${C.red}">console disconnected</span>`;
  $('fresh').classList.toggle('wide', fresh && connected); // narrow screens show it only when something is wrong
  $('fresh').innerHTML = `army state ${clock(army.updated_at)} · ${fresh ? 'fresh' : `<span style="color: ${C.accent}">stale</span>`}${link}`;
  const tally = (n, label, color) => n
    ? `<span class="tally"><b style="color: ${color}">${n}</b> ${label}</span>`
    : `<span class="tally zero"><b>0</b> ${label}</span>`;
  $('tallies').innerHTML = tally(all.filter((a) => a.needs_you).length, 'need you', C.accent) + tally(k.working, 'working', C.blue)
    + tally(k.blocked, 'blocked', C.red) + tally(k.done + k.idle, 'ready', C.green) + tally(k.gone, 'gone', C.purple);
  const corps = army.corps.length, divs = army.corps.reduce((n, c) => n + c.divisions.length, 0) + army.berthier_divisions.length;
  $('army-sub').textContent = `· ${all.length} agent${all.length === 1 ? '' : 's'} · ${corps} corps`
    + (divs ? ` · ${divs} division${divs === 1 ? '' : 's'}` : '') + (army.berthier ? ' + berthier' : '');
}

function renderRows(rows) {
  const focused = document.activeElement?.dataset?.pane;
  $('rows').innerHTML = rows.map((a) => {
    const on = a.pane_id === ui.sel;
    return `<button type="button" class="grid agent" data-pane="${esc(a.pane_id)}" aria-pressed="${on}"${on ? ` style="box-shadow: inset 2px 0 0 ${a.color}"` : ''}>
      <span style="color: ${a.color}" aria-hidden="true">${a.glyph}</span>
      <span class="corps clip" title="${esc(a.parent ? `division of ${a.parent}` : a.who)}">${esc(a.who)}</span>
      <span class="muted">${esc(a.pane_id)}</span>
      <span style="color: ${a.color}">${a.state}</span>
      ${ageSpan(a.from)}
      ${a.report == null && !a.needs_you ? '<span class="clip dim">no report yet</span>'
        : `<span class="clip" style="color: ${a.needs_you ? C.bright : C.muted}">${esc(a.report ?? 'on an approval or question dialog')}</span>`}
    </button>`;
  }).join('') || `<div class="empty">${army.corps.length || army.berthier ? 'no agents match' : 'no agents'}</div>`;
  if (focused) $('rows').querySelector(`[data-pane="${CSS.escape(focused)}"]`)?.focus();
}

// A command the Agent wants the user to run: `! cmd` or the first `backticked` span of a needs-you report.
const askedCmd = (r) => (r && (r.match(/`([^`]+)`/)?.[1] || r.match(/(?:^|\s)(! \S.*)$/)?.[1])) || null;

// The selected row's unit: a Corps, a Division, or Berthier, with its Agents.
function renderDetail(a, all) {
  renderSend(a);
  if (!a) {
    $('det').innerHTML = `<div class="ph"><h2 id="det-h">SELECTED</h2></div><div class="body"><span class="dim">nothing selected</span></div>`;
    return;
  }
  const u = a.unit, mates = all.filter((x) => x.unit === u);
  const kind = a.role === 'division' ? 'DIVISION' : u.name === 'berthier' ? 'BERTHIER' : 'CORPS';
  // Selecting a unit means selecting its first Agent's row.
  const link = (name, unit) => {
    const pane = unit?.agents?.[0]?.pane_id ?? all.find((x) => x.unit === unit)?.pane_id;
    return pane ? `<button type="button" class="link" data-pane="${esc(pane)}">${esc(name)}</button>` : esc(name);
  };
  const facts = [];
  if (a.role === 'division') {
    const corps = all.find((x) => x.role === 'corps' && x.unit.name === a.parent)?.unit;
    facts.push(['corps', link(a.parent, corps)], ['kind', a.unit.worktree ? 'worktree · ends on review' : 'adopted workspace']);
  } else {
    const d = u.divisions || [];
    facts.push(['divisions', d.length ? d.map((x) => link(x.name, x)).join(' ') : '<span class="dim">none</span>']);
  }
  facts.push(['where', esc(home(a.cwd))]);
  if (u.workspace_id) facts.push(['workspace', esc(u.workspace_id)]);
  const cmd = a.needs_you ? askedCmd(a.report) : null;
  const max = army.loop.revive_max ?? 3;
  const mate = (m) => {
    const on = m.pane_id === a.pane_id;
    const revived = m.last_revive_at == null ? '' : ` · <span style="color: ${C.purple}">revived ${clock(m.last_revive_at, false)} (${m.revive_attempts}/${max})</span>`;
    return `<li><button type="button" class="mate" data-pane="${esc(m.pane_id)}" aria-pressed="${on}">
        <span class="mate-l"><span style="color: ${m.color}" aria-hidden="true">${m.glyph}</span>
          <b class="clip">${esc(m.name ?? '(unnamed)')}</b>
          <span class="muted">${esc(m.pane_id)}</span>
          <span style="color: ${m.color}">${m.state}</span>
          ${ageSpan(m.from)}</span>
        ${on && m.needs_you ? '' : `<span class="mate-r ${m.report == null ? 'dim' : ''}">${m.report == null ? 'no report yet' : `<span class="dim">${clock(m.report_at, false)}</span> ${esc(m.report)}`}</span>`}
        ${on ? `<span class="mate-m dim">${esc(m.kind ?? '-')} · session ${esc((m.session_id ?? '-').slice(0, 8))}${revived}</span>` : ''}
      </button></li>`;
  };
  $('det').innerHTML = `
    <div class="ph">
      <h2 id="det-h">${kind} <span>${esc(u.name)}</span></h2>
      <span class="dim">${mates.length} agent${mates.length === 1 ? '' : 's'}</span>
    </div>
    <div class="body">
      ${a.needs_you ? `<div class="needs">
        <div>needs you · waiting <span data-ago="${a.from ?? ''}">${ago(a.from)}</span></div>
        <div>${esc(a.report ?? 'on an approval or question dialog')}</div>
      </div>` : ''}
      ${cmd ? `<div class="cmd run" title="it asks you to run">${esc(cmd)}</div>` : ''}
      <dl>${facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
      <ul class="mates" aria-label="agents">${mates.map(mate).join('')}</ul>
      <div class="cmd check" title="check-in"><span style="color: ${C.green}">$</span> herdr agent read ${esc(a.pane_id)} --source recent-unwrapped --lines 80</div>
    </div>`;
}

// The message box follows the selected Agent, keeping each pane's draft.
let sendPane = null;
function renderSend(a) {
  $('send').hidden = !a;
  if (!a || a.pane_id === sendPane) return;
  if (sendPane != null) drafts[sendPane] = $('msg').value;
  sendPane = a.pane_id;
  $('msg').value = drafts[sendPane] ?? '';
  $('send-to').textContent = `→ ${a.name ?? a.who} · ${a.pane_id}`;
  $('send-status').textContent = '';
}

async function send() {
  const pane = sendPane, text = $('msg').value;
  if (!pane || !text.trim() || $('send-btn').disabled) return;
  $('send-btn').disabled = true;
  $('send-status').style.color = '';
  $('send-status').textContent = 'sending…';
  try {
    const res = await fetch('api/prompt', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pane, text }) });
    if (!res.ok) throw new Error((await res.text()).trim() || res.statusText);
    drafts[pane] = '';
    if (sendPane === pane) {
      $('msg').value = '';
      $('send-status').textContent = `sent ${clock(now())}`;
    }
  } catch (err) {
    if (sendPane === pane) {
      $('send-status').style.color = C.red;
      $('send-status').textContent = 'not sent: ' + err.message;
    }
  } finally {
    $('send-btn').disabled = false;
  }
}

// A top-bar log button's count; `level` colors it: hot needs a look, bad is an error.
function badge(id, n, level) {
  $(id).textContent = n;
  $(id).className = 'badge' + (level ? ' ' + level : '');
}

function renderEscalations() {
  const list = army.escalations;
  $('esc-n').textContent = list.length;
  badge('esc-badge', list.length, list.some((e) => e.at >= now() - 3600) && 'hot');
  $('esc').innerHTML = list.map((e) => {
    const to = e.kind === 'speak' ? ['→ you, aloud', C.accent] : ['→ ' + e.to, C.sky];
    const why = e.kind === 'speak' ? `spoke “${e.why.replace(/\.$/, '')}”` : e.why;
    const when = new Date(e.at * 1000).toLocaleString();
    return `<li class="esc">
      <span class="muted" title="${esc(when)}">${day(e.at)}</span>
      <span style="color: ${C.accent}">${esc(KIND[e.kind] || e.kind)}</span>
      <span>${e.who ? esc(e.who) + ' ' : ''}<span style="color: ${to[1]}">${esc(to[0])}</span></span>
      <span class="why">${esc(why)}</span>
    </li>`;
  }).join('') || '<li class="none">none in 7 days</li>';
}

function renderAsks() {
  const pending = army.asks.length;
  $('inbox').innerHTML = `<span style="color: ${pending ? C.accent : C.green}">inbox ${pending}</span>`;
  const since = now() - 3600;
  const line = (at, from, to, extra, color) => `<li class="ask">
      <span class="muted">${clock(at)}</span>
      <span style="color: ${color}">${esc(from)} → ${esc(to)}${extra}</span>
    </li>`;
  const done = army.ask_log.filter((a) => a.at >= since).reverse()
    .map((a) => line(a.at, a.from, a.to, '', a.from === 'berthier' ? C.sky : C.soft));
  const queued = army.asks.map((a) => line(a.at, a.from, a.to, ' <span class="dim">· queued</span>', C.accent));
  $('ask').innerHTML = done.concat(queued).join('') || '<li class="none">none in the last hour</li>';
  badge('ask-badge', done.length + queued.length, pending && 'hot');
}

function logText(t) {
  return t.replace(/^delivered ask /, 'delivered ').replace(/ -> /g, ' → ');
}

function renderLog() {
  const lines = army.activity.filter((l) => ui.showLoop || l.tag !== 'loop').slice(0, LOG_LINES).reverse();
  const hour = lines.filter((l) => l.at >= now() - 3600);
  badge('log-badge', hour.length, hour.some((l) => l.tag === 'error') && 'bad');
  const ol = $('lines'), atEnd = ol.scrollHeight - ol.scrollTop - ol.clientHeight < 8;
  ol.innerHTML = lines.map((l) => `<li class="log">
      <span class="dim">${clock(l.at)}</span>
      <span style="color: ${TAG[l.tag] || C.muted}">${l.tag === 'other' ? 'info' : esc(l.tag)}</span>
      <span>${esc(logText(l.text))}</span>
    </li>`).join('') + `<li class="log now" id="tick"></li>`;
  renderTick();
  if (atEnd) ol.scrollTop = ol.scrollHeight; // follow the newest line
}

function renderTick() {
  const el = $('tick');
  if (!el || !army) return;
  const next = Math.max(0, Math.ceil(army.updated_at + army.loop.interval - now()));
  el.innerHTML = army.available
    ? `<span class="dim">${clock(army.updated_at)}</span><span style="color: ${C.green}">tick</span><span>watching · next tick in ${next}s <b>▍</b></span>`
    : `<span class="dim">${clock(army.updated_at)}</span><span style="color: ${C.red}">tick</span><span>no tick since ${army.updated_at ? clock(army.updated_at) : 'ever'} · is berthier-loop running?</span>`;
}

function render() {
  if (!army) return;
  const all = agents();
  const rows = visible(all);
  if (!all.some((a) => a.pane_id === ui.sel)) ui.sel = (rows[0] || all[0])?.pane_id ?? null;
  renderHeader(all);
  renderRows(rows);
  renderDetail(all.find((a) => a.pane_id === ui.sel), all);
  renderEscalations();
  renderAsks();
  renderLog();
}

const select = (e) => {
  const b = e.target.closest('[data-pane]');
  if (!b) return;
  ui.sel = b.dataset.pane;
  history.replaceState(null, '', '#' + ui.sel);
  render();
};
$('rows').addEventListener('click', select);
$('det').addEventListener('click', select);
// One log open at a time in the drawer, under the top bar.
function openLog(id) {
  const open = id && ui.log !== id ? id : null;
  ui.log = open;
  document.querySelectorAll('.logbtn').forEach((b) => b.setAttribute('aria-expanded', b.dataset.log === open));
  document.querySelectorAll('#drawer > section').forEach((sec) => { sec.hidden = sec.id !== open; });
  $('drawer').classList.toggle('open', !!open);
  if (open === 'log') $('lines').scrollTop = $('lines').scrollHeight;
}
const placeDrawer = () => document.documentElement.style.setProperty('--drawer-top', document.querySelector('header').getBoundingClientRect().bottom + 'px');
placeDrawer();
addEventListener('resize', placeDrawer);
document.querySelectorAll('.logbtn').forEach((b) => b.addEventListener('click', () => { placeDrawer(); openLog(b.dataset.log); }));
// Closing hands focus back to the log's button.
function closeLog() {
  const was = ui.log;
  openLog(null);
  document.querySelector(`.logbtn[data-log="${was}"]`)?.focus();
}
document.querySelectorAll('#drawer .x').forEach((b) => b.addEventListener('click', closeLog));

$('send').addEventListener('submit', (e) => { e.preventDefault(); send(); });
$('msg').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
$('q').addEventListener('input', (e) => { ui.q = e.target.value; render(); });
$('needs-only').addEventListener('change', (e) => { ui.needsOnly = e.target.checked; pref('needsOnly', ui.needsOnly); render(); });
$('show-loop').addEventListener('change', (e) => { ui.showLoop = e.target.checked; pref('showLoop', ui.showLoop); render(); });
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && !e.target.matches('input, textarea')) { e.preventDefault(); $('q').focus(); }
  else if (e.key === 'Escape' && document.activeElement === $('q')) { $('q').value = ''; ui.q = ''; $('q').blur(); render(); }
  else if (e.key === 'Escape' && ui.log) closeLog();
});

// Ages and the next-tick countdown move every second without re-rendering.
setInterval(() => {
  document.querySelectorAll('[data-ago]').forEach((el) => { el.textContent = ago(el.dataset.ago === '' ? null : +el.dataset.ago); });
  renderTick();
}, 1000);

const events = new EventSource('api/events');
events.onmessage = (e) => { army = JSON.parse(e.data); connected = true; render(); };
events.onopen = () => { connected = true; render(); };
events.onerror = () => { connected = false; render(); };
</script>
</body>
</html>
